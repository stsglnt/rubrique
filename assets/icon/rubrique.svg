<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>rubrique</title>
  <!-- App icon: a lowercase "r" whose arm ends in a red ball. A rubric was a heading
       written in red ink, and the red ball is that ink.
       The tile follows the macOS grid: an 824 px rounded square inside 1024. The "r" is centered:
       the same gap to the tile edge on the left and right, and top and bottom. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#f6efe1" stroke="#d8cbb3" stroke-width="14"/>
  <g transform="translate(512 512) scale(1.3) translate(-487 -550)">
    <path d="M380 730 V480 Q380 370 480 370 Q540 370 565 400" fill="none" stroke="#433422" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="582" cy="430" r="62" fill="#a3311f"/>
  </g>
</svg>
