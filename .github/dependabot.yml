# Weekly pull requests for outdated Rust crates and GitHub Actions.
# Security fixes come as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all small updates instead of one per crate.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its tag is the Rust version to install (stable, or 1.95 for the
      # oldest supported Rust), not a version of the action.
      - dependency-name: dtolnay/rust-toolchain
