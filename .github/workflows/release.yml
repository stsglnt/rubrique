# Builds installable packages for Linux and macOS on every push to main
# (downloadable from the run's artifacts). When Cargo.toml holds a version that
# has no rubrique-vX.Y.Z tag yet, or a rubrique-vX.Y.Z tag is pushed, it also creates that tag
# and a GitHub release with the packages and the CHANGELOG notes.
name: Release

on:
  push:
    branches: [main]
    tags: ["rubrique-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        name: Read version and decide whether to release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          release=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "rubrique-v$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"
              exit 1
            fi
            release=true
          elif ! git rev-parse -q --verify "refs/tags/rubrique-v$version" > /dev/null; then
            release=true
          fi
          echo "Version $version, release: $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux package
    needs: plan
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          sh packaging/linux/package.sh "${{ needs.plan.outputs.version }}"
          cargo deb --no-build --output dist/
      - uses: actions/upload-artifact@v7
        with:
          name: rubrique-linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS app
    needs: plan
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build for Apple Silicon and Intel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle
        run: sh packaging/macos/bundle.sh "${{ needs.plan.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: rubrique-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [plan, linux, macos]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo "- **macOS**: open the .dmg and drag rubrique to Applications. The app is not notarized yet:"
            echo "  the first time, right-click rubrique and choose Open."
            echo "- **Debian / Ubuntu**: \`sudo apt install ./rubrique_*.deb\`"
            echo "- **Other Linux**: unpack the .tar.gz and run \`./install.sh\` (installs to ~/.local)."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: rubrique-v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: rubrique ${{ needs.plan.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
