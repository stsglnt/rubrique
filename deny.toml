# Dependency checks run by `cargo deny check` (locally and in CI):
# known security problems, licenses, duplicate or banned crates, and where
# crates come from. Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only check the platforms rubrique ships for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# RustSec advisories: vulnerable, unmaintained, unsound or yanked crates fail.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. A crate offering several (MIT OR Apache-2.0) passes
# when one of them is on this list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    # The default egui fonts.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# rubrique itself is not published, so it needs no license field.
ignore = true

[bans]
# Several versions of one crate are normal in GUI stacks (winit, objc2), so
# they are not reported.
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Crates only from crates.io, never from random git repositories.
unknown-registry = "deny"
unknown-git = "deny"
